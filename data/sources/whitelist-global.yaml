schema_version: "1.0"
region: "global"
updated_at: "2026-11-26"
description: "LexAIDaily 大陆以外轨（region: global）权威一手白名单信源配置，优先采用 RSS/Atom 与公开只读 JSON API（ADR-0003）。"
sources:
  - source_id: "us-federal-register-api"
    region: "global"
    name: "US Federal Register API v1"
    source_type: "legislation_regulator"
    language: "en"
    jurisdiction: "US"
    default_categories:
      - "监管与合规"
    fetch_mode: "json_api"
    entry_url: "https://www.federalregister.gov/api/v1/documents.json"
    expected_domain: "www.federalregister.gov"
    authority_tier: "T1"
    high_risk_default: true
    discovery_only: false
    status: "active"
    verified_at: "2026-11-26"
    verification_note: "2026-11-26 实测免凭据公开 REST JSON 接口返回 HTTP 200。"

  - source_id: "us-ncsl-ai-legislation"
    region: "global"
    name: "NCSL US State Artificial Intelligence Legislation Summary"
    source_type: "legislation_regulator"
    language: "en"
    jurisdiction: "US-STATES"
    default_categories:
      - "监管与合规"
    fetch_mode: "static_html"
    entry_url: "https://www.ncsl.org/technology-and-communication/artificial-intelligence-2025-legislation"
    expected_domain: "www.ncsl.org"
    authority_tier: "T2"
    high_risk_default: true
    discovery_only: false
    status: "active"
    verified_at: "2026-11-26"
    verification_note: "2026-11-26 实测 HTTP 200 静态 HTML 汇总页（含美国各州 AI 立法静态条文摘要，免登录无需 JS 表单；已弃用需表单交互的 database 检索页；2026 年度汇总页暂 404，上线后同步切换；属州立法聚合定级 T2，高风险默认 true）。"

  - source_id: "us-courtlistener"
