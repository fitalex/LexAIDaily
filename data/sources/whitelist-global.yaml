    expected_domain: "www.courtlistener.com"
    authority_tier: "T2"
    high_risk_default: true
    discovery_only: false
    status: "active"
    verified_at: "2026-11-26"
    verification_note: "2026-11-26 实测公开 Atom 检索订阅源返回 HTTP 200 application/atom+xml，免登录且匿名只读（已弃用需鉴权的 REST v3/v4 检索接口；因属非营利公开判例归档平台定级 T2，高风险默认 true）。"

