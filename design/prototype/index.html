<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LEXAI DAILY｜法律人的 AI 情报雷达 — Gate 1 复古报刊原型 V12</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,800;0,6..96,900;1,6..96,500&family=JetBrains+Mono:wght@400;500&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper-bg: #CCC4BA;
      --paper-inset: #C2B9AE;
      --paper-modal: #DCD5CB;
      --ink: #1D1D1B;
      --ink-body: #2A2825;
      --ink-muted: #524D46;
      --rule-strong: rgba(29, 29, 27, 0.85);
      --rule: rgba(29, 29, 27, 0.36);
      --rule-light: rgba(29, 29, 27, 0.16);
      --accent: #C03F13;
      --accent-text: #F4EDE4;

      /* 方案 A｜手工冷压棉纸：无黑点柔和凹凸冷压肌理 + 细腻棉浆层次（Handmade Paper + Rice Paper 2，CC BY-SA 3.0 via Transparent Textures / Subtle Patterns） */
      --paper-cotton-relief: url("https://www.transparenttextures.com/patterns/handmade-paper.png");
      --paper-cotton-pulp: url("https://www.transparenttextures.com/patterns/rice-paper-2.png");

      --font-display: "Bodoni Moda", Georgia, "Times New Roman", serif;
      --font-masthead-cn: "Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", serif;
      --font-serif-cn: "Noto Serif SC", "Songti SC", "STSong", "SimSun", Georgia, serif;
      --font-sans-cn: "Noto Sans SC", -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: #1D1D1B; overflow-x: hidden; }
    body {
      font-family: var(--font-serif-cn);
      background-color: var(--paper-bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ========== 0. 经典复古报刊 4 秒开屏动效（GPU 合成线程驱动，零卡顿） ========== */
    body.intro-playing {
      background-color: #1D1D1B;
      overflow: hidden;
      height: 100vh;
    }
    body.intro-playing .stage-wrapper {
      transform-origin: 50% 24vh;
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    /* 首帧预停在底部之外，避免字体/图片首帧解析引起白屏或跳闪 */
    body.intro-ready .stage-wrapper {
      transform: translate3d(0, 94vh, 0) scale(0.40) rotate(0deg);
    }
    @media (max-width: 960px) {
      body.intro-ready .stage-wrapper {
        transform: translate3d(0, 88vh, 0) scale(0.54) rotate(0deg);
      }
    }
    body.intro-playing .paper-page {
      outline: 1px solid rgba(255, 255, 255, 0.09);
      pointer-events: none;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    /* 旋转缩放期间暂停整页表层正片叠底重绘，落位后平滑淡入，确保 60/120fps 丝滑 */
    body.intro-playing .paper-page::after {
      opacity: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      body.intro-playing,
      body.intro-ready { background-color: var(--paper-bg); overflow: auto; height: auto; }
      body.intro-playing .stage-wrapper,
      body.intro-ready .stage-wrapper { transform: none !important; will-change: auto; }
      body.intro-playing .paper-page { outline: none; pointer-events: auto; }
      body.intro-playing .paper-page::after { opacity: 0.42; }
    }

    .stage-wrapper { width: 100%; transition: padding 0.35s var(--ease); }
    body.mobile-preview { background: #262522; }
    body.mobile-preview .stage-wrapper { padding: 24px 14px 56px; display: flex; justify-content: center; }

    /* 整张手工冷压棉纸版面：柔和压纹（140px）叠加无黑点棉浆肌理（485px），互质错周期避免视觉重复 */
    .paper-page {
      position: relative;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      background-color: var(--paper-bg);
      background-image: var(--paper-cotton-relief), var(--paper-cotton-pulp);
      background-size: 140px 140px, 485px 485px;
      background-repeat: repeat, repeat;
      background-blend-mode: multiply, multiply;
      transition: max-width 0.35s var(--ease);
      overflow-x: hidden;
    }
    /* 表层轻度棉纸吃墨层：让文字、1px 细线与报头带与冷压棉纸自然贴合（零投影、零毛玻璃） */
    .paper-page::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 45;
      background-image: var(--paper-cotton-relief);
      background-size: 140px 140px;
      background-repeat: repeat;
      mix-blend-mode: multiply;
      opacity: 0.42;
      transition: opacity 0.45s ease;
    }
    body.mobile-preview .paper-page {
      max-width: 375px;
      border: 1px solid #4C4842;
    }

    /* ========== 1. 顶部报眉 ========== */
    .top-bar {
      height: 84px;
      padding: 0 40px;
      border-bottom: 1px solid var(--rule-strong);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    /* 左上角媒体矩阵图标栏（微信 / 小红书 / 抖音 / GitHub） */
    .social-bar {
      display: inline-flex;
      align-items: center;
      gap: 15px;
      position: relative;
    }
    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      text-decoration: none;
      padding: 3px;
      transition: color 0.18s var(--ease), transform 0.18s var(--ease);
      cursor: pointer;
    }
    .social-link:hover {
      color: var(--accent);
      transform: translateY(-1px);
    }
    .social-link svg {
      display: block;
      height: 18px;
      width: auto;
    }
    .social-toast {
      position: absolute;
      left: 0;
      top: calc(100% + 10px);
      z-index: 70;
      background: var(--ink);
      color: var(--paper-bg);
      font-family: var(--font-sans-cn);
      font-size: 11.5px;
      padding: 4px 10px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s var(--ease);
    }
    .social-toast.show { opacity: 1; }

    .top-center {
      font-family: var(--font-masthead-cn);
      font-weight: 400;
      font-size: 26px;
      letter-spacing: 0.08em;
      text-align: center;
      line-height: 1.1;
      white-space: nowrap;
    }
    .top-center-latin {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 21px;
      letter-spacing: 0.02em;
      margin: 0 3px;
      vertical-align: 1px;
    }
    .top-right { display: flex; justify-content: flex-end; align-items: center; gap: 16px; }

    .viewport-mini { display: inline-flex; border: 1px solid var(--rule-strong); flex-shrink: 0; }
    .vp-btn {
      background: transparent; border: none; padding: 3px 10px;
      font-family: var(--font-sans-cn); font-size: 11.5px; color: var(--ink-muted); cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, color 0.2s;
    }
    .vp-btn.active { background: var(--ink); color: var(--paper-bg); }

    /* 右上角双横杠菜单入口（已移除旧抽屉，保留为后续扩展板块入口） */
    .menu-btn {
      width: 34px; height: 28px; background: transparent; border: none; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 2px;
      flex-shrink: 0;
    }
    .menu-btn span { display: block; width: 100%; height: 1.5px; background: var(--ink); transition: background 0.2s; }
    .menu-btn:hover span { background: var(--accent); }

    /* ========== 2. 首屏流动三卡横轨（左右边缘与底部 LEXAI DAILY 严格同宽对齐） ========== */
    .hero-section { padding: 30px 40px 26px; }
    .hero-rail-viewport {
      width: 100%;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      margin-bottom: 28px;
      padding: 4px 0;
      touch-action: pan-y;
    }
    .hero-rail-viewport.dragging { cursor: grabbing; }
    .hero-rail-track { display: flex; align-items: stretch; will-change: transform; }
    .rail-item {
      flex: 0 0 33.3333%;
      min-width: 33.3333%;
      padding: 0 28px;
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
    }

    /* 今日综述上边缘与相邻卡片图片上边缘齐平，底部 TIP 贴底对齐 */
    .digest-rail-card {
      justify-content: flex-start;
      align-items: center;
      text-align: center;
      gap: 0;
      padding: 0 34px;
    }
    .digest-kicker-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: -3px;
    }
    .digest-kicker {
      font-family: var(--font-serif-cn);
      font-weight: 900;
      font-size: clamp(34px, 3.2vw, 48px);
      line-height: 0.98;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .digest-draft-tag {
      border: 1px dashed var(--rule-strong);
      font-family: var(--font-sans-cn);
      font-size: 10.5px;
      color: var(--ink-muted);
      padding: 2px 6px;
      line-height: 1.2;
    }
    .digest-text {
      margin-top: 22px;
      font-family: var(--font-serif-cn);
      font-weight: 500;
      font-size: 16.5px;
      line-height: 1.82;
      color: var(--ink-body);
      max-width: 32ch;
      text-align: justify;
      text-justify: inter-ideograph;
      text-align-last: center;
    }
    .digest-tip {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--rule-light);
      font-family: var(--font-sans-cn);
      font-size: 11.5px;
      color: var(--ink-muted);
      letter-spacing: 0.03em;
      width: 100%;
    }
    .digest-tip strong { font-family: var(--font-mono); color: var(--ink); margin-right: 5px; }

    /* ========== 3. 报刊印制级卡片 ========== */
    .m-card { cursor: pointer; display: flex; flex-direction: column; height: 100%; }
    .m-card-art-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 7;
      border: 1px solid var(--rule-strong);
      border-radius: 0;
      overflow: hidden;
      background: #B8B0A5;
      flex-shrink: 0;
    }
    .m-card-art-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(200, 192, 182, 0.14);
      mix-blend-mode: multiply;
      pointer-events: none;
      transition: opacity 0.45s var(--ease);
    }
    .m-card:hover .m-card-art-frame::after { opacity: 0; }

    .m-card-art-img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
      filter: sepia(0.11) contrast(1.03) saturate(0.88) brightness(0.96);
      transition: transform 0.55s var(--ease), filter 0.45s var(--ease);
    }
    .m-card-art-fallback { width: 100%; height: 100%; display: none; }
    .m-card-art-frame.is-fallback .m-card-art-img { display: none; }
    .m-card-art-frame.is-fallback .m-card-art-fallback { display: block; }
    .m-card-art-fallback svg { width: 100%; height: 100%; display: block; pointer-events: none; transition: transform 0.55s var(--ease); }
    .m-card:hover .m-card-art-img {
      transform: scale(1.035);
      filter: sepia(0.02) contrast(1.02) saturate(1.02) brightness(1);
    }
    .m-card:hover .m-card-art-fallback svg { transform: scale(1.035); }

    .m-card-kicker {
      margin-top: 14px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
    }
    .m-kicker-left { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
    .m-kicker-num { color: var(--ink); font-weight: 500; }
    .m-kicker-cat { font-family: var(--font-sans-cn); font-size: 11.5px; color: var(--ink-muted); letter-spacing: 0.02em; }
    .m-badge {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-text);
      font-family: var(--font-sans-cn);
      font-size: 10.5px;
      font-weight: 600;
      padding: 1px 6px;
      border-radius: 1px;
      line-height: 1.35;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }
    .m-badge.outline { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .m-placeholder-tag {
      font-family: var(--font-sans-cn);
      font-size: 10.5px;
      color: var(--ink-muted);
      letter-spacing: 0.03em;
      opacity: 0.85;
      flex-shrink: 0;
    }

    .m-card-title {
      margin-top: 8px;
      font-family: var(--font-serif-cn);
      font-weight: 700;
      font-size: 19px;
      line-height: 1.36;
      letter-spacing: -0.015em;
      color: var(--ink);
      min-height: calc(1.36em * 2);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      transition: color 0.2s;
    }
    .m-card:hover .m-card-title { color: var(--accent); }

    .m-card-summary {
      margin-top: 10px;
      font-family: var(--font-sans-cn);
      font-size: 13.8px;
      line-height: 1.74;
      letter-spacing: 0.015em;
      color: var(--ink-body);
      text-align: justify;
      text-justify: inter-ideograph;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ========== 4. 首屏底部满宽巨型墨黑反白报头带（与上方横轨同处 hero-section，宽度 100% 一致） ========== */
    .masthead-black-band { width: 100%; background: var(--ink); padding: 10px 14px 8px; display: block; }
    .masthead-svg { width: 100%; height: auto; display: block; }

    /* ========== 5. 第二屏：左侧分类索引 + 右上角近三天期号与更多日期切换 ========== */
    .feed-section { padding: 20px 40px 48px; }
    .index-bar {
      position: relative;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 15px 0 11px;
      border-top: 2px solid var(--ink);
      border-bottom: 1px solid var(--ink);
      box-shadow: inset 0 3px 0 0 rgba(204, 196, 186, 0.72), inset 0 4px 0 0 var(--rule-strong);
      flex-wrap: wrap;
    }
    .cat-list { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .cat-btn {
      background: transparent; border: 1px solid transparent; color: var(--ink);
      font-family: var(--font-sans-cn); font-size: 13.5px; font-weight: 500;
      padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
      white-space: nowrap;
    }
    .cat-btn:hover { border-color: var(--rule); }
    .cat-btn.active { background: var(--ink); color: var(--paper-bg); border-color: var(--ink); }
    .cat-num { font-family: var(--font-mono); font-size: 10px; opacity: 0.72; }

    /* 第二屏右上角期号切换条（近三天 + 更多日期） */
    .edition-nav {
      position: relative;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .recent-dates-wrap { display: contents; }
    .date-pill {
      background: transparent;
      border: 1px solid var(--rule);
      padding: 4px 10px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink);
      cursor: pointer;
      transition: background 0.18s, color 0.18s, border-color 0.18s;
      white-space: nowrap;
      text-align: center;
    }
    .date-pill:hover { border-color: var(--ink); }
    .date-pill.active { background: var(--ink); color: var(--paper-bg); border-color: var(--ink); }
    .date-more-btn {
      background: transparent;
      border: 1px dashed var(--rule-strong);
      padding: 4px 10px;
      font-family: var(--font-sans-cn);
      font-size: 12px;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
      text-align: center;
      transition: background 0.18s, color 0.18s;
    }
    .date-more-btn:hover,
    .date-more-btn.open { background: var(--ink); color: var(--paper-bg); border-style: solid; }

    /* 更多日期历史归档弹出面板（同款冷压棉纸肌理 + 直角 1.5px 黑框，零投影） */
    .archive-popover {
      display: none;
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 60;
      width: 280px;
      background-color: var(--paper-modal);
      background-image: var(--paper-cotton-relief), var(--paper-cotton-pulp);
      background-size: 140px 140px, 485px 485px;
      background-blend-mode: multiply, multiply;
      border: 1.5px solid var(--ink);
      padding: 14px 16px;
    }
    .archive-popover.open { display: block; }
    .archive-pop-title {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: var(--ink-muted);
      padding-bottom: 8px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
    }
    .archive-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .archive-item {
      display: flex; justify-content: space-between; align-items: center;
      background: transparent; border: 1px solid var(--rule-light); padding: 6px 10px;
      font-family: var(--font-mono); font-size: 12px; color: var(--ink); cursor: pointer; text-align: left;
    }
    .archive-item:hover { border-color: var(--ink); background: rgba(29, 29, 27, 0.05); }
    .archive-item.active { background: var(--ink); color: var(--paper-bg); border-color: var(--ink); }
    .archive-note { font-family: var(--font-sans-cn); font-size: 11px; color: var(--ink-muted); line-height: 1.5; }

    .broadsheet-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 2px solid var(--ink);
      margin-left: -32px;
      margin-right: -32px;
    }
    .grid-cell {
      padding: 32px 32px 34px;
      border-right: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
    }
    .grid-cell:nth-child(3n) { border-right: none; }
    .empty-msg { grid-column: 1 / -1; padding: 54px 32px; text-align: center; font-size: 15px; color: var(--ink-muted); }

    .colophon {
      padding: 20px 0 8px; display: flex; align-items: center; justify-content: flex-start;
    }
    .colophon strong { font-family: var(--font-display); font-size: 16px; color: var(--ink); }

    /* ========== 6. 详情剪报弹窗（同款手工冷压棉纸肌理） ========== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(29, 29, 27, 0.78); z-index: 300;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background-color: var(--paper-modal);
      background-image: var(--paper-cotton-relief), var(--paper-cotton-pulp);
      background-size: 140px 140px, 485px 485px;
      background-blend-mode: multiply, multiply;
      color: var(--ink); width: 100%; max-width: 740px; max-height: 90vh;
      overflow-y: auto; border: 2px solid var(--ink); border-radius: 0; padding: 26px 32px 30px;
    }
    .modal-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding-bottom: 12px; border-bottom: 1px solid var(--rule); margin-bottom: 18px;
      font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted);
    }
    .modal-close {
      background: transparent; border: 1px solid var(--ink); color: var(--ink);
      padding: 4px 12px; font-family: var(--font-mono); font-size: 12px; cursor: pointer; flex-shrink: 0;
    }
    .modal-close:hover { background: var(--ink); color: var(--paper-modal); }
    .modal-art-wrap { margin-bottom: 18px; }
    .modal-art {
      width: 100%;
      aspect-ratio: 16 / 7;
      border: 1px solid var(--ink);
      border-radius: 0;
      overflow: hidden;
      background: #B8B0A5;
    }
    .modal-art .m-card-art-img { filter: none; }
    .modal-art-caption {
      margin-top: 6px;
      font-family: var(--font-sans-cn);
      font-size: 11.5px;
      color: var(--ink-muted);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    let currentDate = "2026-11-22", currentCategory = "全部", currentModalItem = null;
    let railOffset = 0, isHovered = false, isDragging = false, dragStartX = 0, dragStartOffset = 0, totalDragDist = 0;
    let socialToastTimer = null;
    const DRIFT_SPEED = 0.42;

    function setViewport(mode) {
      document.body.classList.toggle("mobile-preview", mode === "mobile");
      document.getElementById("vpDesktop").classList.toggle("active", mode === "desktop");
      document.getElementById("vpMobile").classList.toggle("active", mode === "mobile");
      railOffset = 0;
    }

    function showSocialToast(e, msg) {
      e.preventDefault();
      const toast = document.getElementById("socialToast");
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(socialToastTimer);
      socialToastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    function toggleArchivePopover(e) {
      e.stopPropagation();
      const pop = document.getElementById("archivePopover");
      const btn = document.getElementById("moreDatesBtn");
      const next = !pop.classList.contains("open");
      pop.classList.toggle("open", next);
      btn.classList.toggle("open", next);
    }

    function closeArchivePopover() {
      document.getElementById("archivePopover").classList.remove("open");
      document.getElementById("moreDatesBtn").classList.remove("open");
    }

    function renderCardHTML(item, indexNum, isRail = false) {
      const clickHandler = isRail ? `handleRailCardClick('${item.id}')` : `openModal('${item.id}')`;
      const seq = String(indexNum + 1).padStart(2, "0");
      const badgeHTML = item.badge
        ? `<span class="m-badge ${item.badgeOutline ? "outline" : ""}">${item.badge}</span>`
        : "";
      const placeholderHTML = item.placeholder ? `<span class="m-placeholder-tag">〔示例〕</span>` : "";
      return `
        <article class="m-card" onclick="${clickHandler}">
          <div class="m-card-art-frame">${renderArtFrameHTML(item.category, item.category + " 主题插画")}</div>
          <div class="m-card-kicker">
            <div class="m-kicker-left">
              <span class="m-kicker-num">NO.${seq}</span>
              <span>·</span>
              <span class="m-kicker-cat">${item.category}</span>
              ${badgeHTML}
            </div>
            ${placeholderHTML}
          </div>
          <h3 class="m-card-title">${item.title}</h3>
          <p class="m-card-summary">${item.summary}</p>
        </article>
      `;
    }

    function renderDigestSlotHTML(ed) {
      return `
        <div class="rail-item digest-rail-card">
          <div class="digest-kicker-row">
            <div class="digest-kicker">今日综述</div>
            <span class="digest-draft-tag">AI 初稿</span>
          </div>
          <p class="digest-text">${ed.digest}</p>
          <div class="digest-tip"><strong>TIP!</strong>悬停暂停流动 · 左右拖拽或点击卡片查看详情</div>
        </div>
      `;
    }

    function render() {
      const ed = EDITIONS[currentDate];

      const singleSetParts = [];
      if (ed.items[0]) singleSetParts.push(`<div class="rail-item">${renderCardHTML(ed.items[0], 0, true)}</div>`);
      singleSetParts.push(renderDigestSlotHTML(ed));
      ed.items.slice(1).forEach((item, idx) => {
        singleSetParts.push(`<div class="rail-item">${renderCardHTML(item, idx + 1, true)}</div>`);
      });
      const setHTML = singleSetParts.join("");
      document.getElementById("heroTrack").innerHTML = setHTML + setHTML;
      railOffset = 0;

      document.getElementById("catList").innerHTML = CATEGORIES.map(cat => {
        const count = cat === "全部" ? ed.items.length : ed.items.filter(i => i.category === cat).length;
        return `<button class="cat-btn ${cat === currentCategory ? "active" : ""}" onclick="selectCategory('${cat}')">${cat}<span class="cat-num">${count}</span></button>`;
      }).join("");

      document.getElementById("recentDates").innerHTML = RECENT_KEYS.map(d =>
        `<button class="date-pill ${d === currentDate ? "active" : ""}" onclick="selectDate('${d}')">${EDITIONS[d].label}</button>`
      ).join("");

      const isArchiveSelected = !RECENT_KEYS.includes(currentDate);
      const moreBtn = document.getElementById("moreDatesBtn");
      moreBtn.textContent = isArchiveSelected ? `${EDITIONS[currentDate].label} ▾` : "更多日期 ▾";

      document.getElementById("archiveVolText").textContent = ed.vol;
      document.getElementById("archiveList").innerHTML = Object.keys(EDITIONS).map(d => {
        const itemEd = EDITIONS[d];
        return `<button class="archive-item ${d === currentDate ? "active" : ""}" onclick="selectDate('${d}')"><span>${d} · ${itemEd.label}</span><span>${itemEd.items.length} 条</span></button>`;
      }).join("");

      const filtered = ed.items.filter(item => currentCategory === "全部" || item.category === currentCategory);

      const grid = document.getElementById("broadsheetGrid");
      grid.innerHTML = filtered.length === 0
        ? `<div class="empty-msg">当前筛选条件下暂无情报，可切换分类或日期查看往期。</div>`
        : filtered.map((item, idx) => `<div class="grid-cell">${renderCardHTML(item, idx, false)}</div>`).join("");
    }

    function tickRail() {
      const track = document.getElementById("heroTrack");
      if (track && track.scrollWidth > 0 && !document.body.classList.contains("intro-playing")) {
        const half = track.scrollWidth / 2;
        if (!isHovered && !isDragging) railOffset += DRIFT_SPEED;
        if (railOffset >= half) railOffset -= half;
        if (railOffset < 0) railOffset += half;
        track.style.transform = `translate3d(${-railOffset}px, 0, 0)`;
      }
      requestAnimationFrame(tickRail);
    }

    function handleRailCardClick(id) {
      if (totalDragDist > 6) return;
      openModal(id);
    }

    const heroVp = document.getElementById("heroViewport");
    heroVp.addEventListener("mouseenter", () => { isHovered = true; });
    heroVp.addEventListener("mouseleave", () => { isHovered = false; isDragging = false; heroVp.classList.remove("dragging"); });
    heroVp.addEventListener("pointerdown", (e) => {
      isDragging = true; dragStartX = e.clientX; dragStartOffset = railOffset; totalDragDist = 0;
      heroVp.classList.add("dragging"); heroVp.setPointerCapture(e.pointerId);
    });
    heroVp.addEventListener("pointermove", (e) => {
      if (!isDragging) return;
      const dx = e.clientX - dragStartX; totalDragDist = Math.abs(dx); railOffset = dragStartOffset - dx;
    });
    heroVp.addEventListener("pointerup", (e) => {
      if (!isDragging) return;
      isDragging = false; heroVp.classList.remove("dragging"); heroVp.releasePointerCapture(e.pointerId);
    });

    function selectCategory(cat) { currentCategory = cat; render(); }
    function selectDate(d) { currentDate = d; currentCategory = "全部"; closeArchivePopover(); render(); }

    function openModal(id) {
      const item = EDITIONS[currentDate].items.find(i => i.id === id);
      if (!item) return;
      currentModalItem = item;
      const slug = CATEGORY_SLUG_MAP[item.category] || "regulation";
      const sampleText = item.placeholder ? " · 示例占位" : "";
      document.getElementById("modalMeta").textContent = `${item.category} · ${item.factLevel} · ${item.date}${sampleText}`;
      const modalArt = document.getElementById("modalArt");
      modalArt.classList.remove("is-fallback");
      modalArt.innerHTML = renderArtFrameHTML(item.category, item.category + " 主题插画");
      document.getElementById("modalArtSlug").textContent = `baseline-${slug}-v2.webp`;
      document.getElementById("modalTitle").textContent = item.title;
      document.getElementById("modalSummary").textContent = item.summary;
      document.getElementById("modalImpactList").innerHTML = item.impact.map(line => `<li>${line}</li>`).join("");
      const srcBtn = document.getElementById("modalSourceBtn");
      srcBtn.href = `https://${item.sourceDomain}`;
      srcBtn.textContent = `直达一手信源（${item.sourceDomain}）↗`;
      document.getElementById("modalCopyBtn").textContent = "复制法律人引用格式";
      document.getElementById("modalBackdrop").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
      document.body.style.overflow = "";
    }

    function copyCitation() {
      if (!currentModalItem) return;
      const cite = `【LexAIDaily ${currentModalItem.date}｜${currentModalItem.category}】${currentModalItem.title}（${currentModalItem.factLevel}；一手信源：https://${currentModalItem.sourceDomain}）`;
      navigator.clipboard?.writeText(cite).catch(() => {});
      const btn = document.getElementById("modalCopyBtn");
      btn.textContent = "已复制引用格式 ✓";
      setTimeout(() => { btn.textContent = "复制法律人引用格式"; }, 1800);
    }

    document.getElementById("modalBackdrop").addEventListener("click", e => { if (e.target.id === "modalBackdrop") closeModal(); });
    document.addEventListener("click", e => {
      if (!e.target.closest(".edition-nav")) closeArchivePopover();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") { closeModal(); closeArchivePopover(); }
    });

    /* 首屏内容先渲染完毕，再在 GPU 合成线程启动 4.0s 丝滑开屏报刊动效 */
    render();
    requestAnimationFrame(tickRail);

    (function runSmoothNewspaperIntro() {
      const cleanup = () => {
        document.body.classList.remove("intro-playing", "intro-ready");
      };
      if ((window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) || !Element.prototype.animate) {
        cleanup();
        return;
      }

      const stage = document.getElementById("stageWrapper");
      const isNarrow = window.innerWidth <= 960;
      const baseScale = isNarrow ? 0.54 : 0.40;
      const breathScale = isNarrow ? 0.56 : 0.415;
      const startY = isNarrow ? "88vh" : "94vh";
      const midY = isNarrow ? "-2vh" : "-3vh";
      const peakY = isNarrow ? "-3vh" : "-4.2vh";

      const waitFonts = document.fonts && document.fonts.ready
        ? Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 180))])
        : Promise.resolve();

      waitFonts.then(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            document.body.classList.remove("intro-ready");
            const anim = stage.animate(
              [
                {
                  offset: 0,
                  transform: `translate3d(0, ${startY}, 0) scale(${baseScale}) rotate(0deg)`,
                  easing: "cubic-bezier(0.16, 1, 0.3, 1)"
                },
                {
                  offset: 0.38,
                  transform: `translate3d(0, ${midY}, 0) scale(${baseScale}) rotate(0deg)`,
                  easing: "cubic-bezier(0.45, 0, 0.55, 1)"
                },
                {
                  offset: 0.52,
                  transform: `translate3d(0, ${peakY}, 0) scale(${breathScale}) rotate(0deg)`,
                  easing: "cubic-bezier(0.77, 0, 0.175, 1)"
                },
                {
                  offset: 1,
                  transform: "translate3d(0, 0, 0) scale(1) rotate(-360deg)"
                }
              ],
              { duration: 4000, fill: "forwards" }
            );
            anim.finished.then(() => {
              anim.cancel();
              cleanup();
            }).catch(cleanup);
          });
        });
      });
    })();
  </script>
