<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Legal AI Daily — LEXAI DAILY｜Miranda 报刊原型 V3.2</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,600;0,6..96,800;0,6..96,900;1,6..96,500&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper-bg: #C8C0B6;
      --paper-inset: #BEB5AA;
      --paper-modal: #D8D1C7;
      --ink: #1D1D1B;
      --ink-body: #2B2926;
      --ink-muted: #4C4842;
      --rule: rgba(29, 29, 27, 0.42);
      --rule-light: rgba(29, 29, 27, 0.2);
      --accent: #C03F13;
      --accent-text: #F4EDE4;

      --font-display: "Bodoni Moda", Georgia, "Times New Roman", serif;
      --font-serif-cn: "Noto Serif SC", "Songti SC", "STSong", serif;
      --font-sans-cn: "Noto Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; background: #B8B0A5; }
    body {
      font-family: var(--font-serif-cn);
      background-color: var(--paper-bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 旧报纸纤维微噪点 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.055;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .stage-wrapper { width: 100%; transition: padding 0.35s var(--ease); }
    body.mobile-preview { background: #262522; }
    body.mobile-preview .stage-wrapper { padding: 24px 14px 56px; display: flex; justify-content: center; }

    .paper-page {
      width: 100%;
      max-width: 1480px;
      margin: 0 auto;
      background: var(--paper-bg);
      transition: max-width 0.35s var(--ease);
    }
    body.mobile-preview .paper-page {
      max-width: 396px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.14);
    }

    /* ========== 1. 顶部极简 1px 报眉 ========== */
    .top-bar {
      height: 74px;
      padding: 0 32px;
      border-bottom: 1px solid var(--rule);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }
    .top-left { font-family: var(--font-serif-cn); font-size: 13.5px; color: var(--ink-body); }
    .top-center { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.01em; text-align: center; }
    .top-right { display: flex; justify-content: flex-end; align-items: center; gap: 16px; }

    .viewport-mini { display: inline-flex; border: 1px solid var(--rule); }
    .vp-btn {
      background: transparent; border: none; padding: 3px 9px;
      font-family: var(--font-sans-cn); font-size: 11.5px; color: var(--ink-muted); cursor: pointer;
    }
    .vp-btn.active { background: var(--ink); color: var(--paper-bg); }

    .menu-btn {
      width: 34px; height: 28px; background: transparent; border: none; cursor: pointer;
      display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 2px;
    }
    .menu-btn span { display: block; width: 100%; height: 1.5px; background: var(--ink); transition: transform 0.25s var(--ease); }
    .menu-btn.open span:first-child { transform: translateY(3.25px) rotate(12deg); }
    .menu-btn.open span:last-child { transform: translateY(-3.25px) rotate(-12deg); }

    .drawer {
      display: none; padding: 16px 32px; border-bottom: 1px solid var(--ink); background: var(--paper-inset);
      align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px;
    }
    .drawer.open { display: flex; }
    .drawer-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-family: var(--font-sans-cn); font-size: 13px; }
    .date-pill {
      background: transparent; border: 1px solid var(--rule); padding: 4px 11px;
      font-family: var(--font-mono); font-size: 12px; color: var(--ink); cursor: pointer;
    }
    .date-pill.active { background: var(--ink); color: var(--paper-bg); border-color: var(--ink); }
    .drawer-search {
      background: transparent; border: none; border-bottom: 1px solid var(--ink);
      padding: 4px 6px; font-family: var(--font-sans-cn); font-size: 13px; color: var(--ink); width: 210px; outline: none;
    }

    /* ========== 2. 首屏缓缓流动横轨（卡片 + 今日综述） ========== */
    .hero-section {
      padding: 30px 0 26px;
    }

    .hero-rail-viewport {
      width: 100%;
      overflow: hidden;
      cursor: grab;
      user-select: none;
      margin-bottom: 30px;
      padding: 4px 0;
    }
    .hero-rail-viewport.dragging {
      cursor: grabbing;
    }

    .hero-rail-track {
      display: flex;
      align-items: stretch;
      will-change: transform;
    }

    /* 每个轨道单元严格占首屏 1/3 宽，1px 竖线分隔，1:1 复刻录屏节奏 */
    .rail-item {
      flex: 0 0 33.3333%;
      min-width: 33.3333%;
      padding: 0 32px;
      border-right: 1px solid var(--rule);
      display: flex;
      flex-direction: column;
    }

    /* 今日综述居中面板 */
    .digest-rail-card {
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 14px;
      padding-top: 6px;
      padding-bottom: 6px;
    }
    .digest-kicker-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .digest-kicker {
      font-family: var(--font-serif-cn);
      font-weight: 900;
      font-size: clamp(32px, 3vw, 46px);
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .digest-draft-tag {
      border: 1px dashed var(--ink);
      font-family: var(--font-sans-cn);
      font-size: 11px;
      color: var(--ink-muted);
      padding: 2px 6px;
      line-height: 1.2;
    }
    .digest-text {
      font-family: var(--font-serif-cn);
      font-weight: 500;
      font-size: 16.5px;
      line-height: 1.65;
      color: var(--ink-body);
      max-width: 34ch;
    }
    .digest-tip {
      margin-top: 6px;
      font-family: var(--font-sans-cn);
      font-size: 12px;
      color: var(--ink-muted);
      letter-spacing: 0.02em;
    }
    .digest-tip strong {
      font-family: var(--font-mono);
      color: var(--ink);
      margin-right: 4px;
    }

    /* ========== 3. 单张情报卡片（零底色/零外链/零实务影响） ========== */
    .m-card {
      cursor: pointer;
      display: flex;
      flex-direction: column;
    }
    .m-card-art-frame {
      width: 100%;
      aspect-ratio: 16 / 7;
      border: 1px solid var(--ink);
      overflow: hidden;
      background: #1C1B19;
    }
    .m-card-art-frame svg {
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
      transition: transform 0.55s var(--ease);
    }
    .m-card:hover .m-card-art-frame svg { transform: scale(1.045); }
    .m-card-head {
      margin-top: 13px;
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }
    .m-card-title {
      font-family: var(--font-serif-cn);
      font-weight: 900;
      font-size: 18.5px;
      line-height: 1.32;
      letter-spacing: -0.01em;
      color: var(--ink);
      transition: color 0.2s;
    }
    .m-card:hover .m-card-title { color: var(--accent); }
    .m-badge {
      display: inline-block;
      background: var(--accent);
      color: var(--accent-text);
      font-family: var(--font-sans-cn);
      font-size: 11px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 2px;
      line-height: 1.25;
      flex-shrink: 0;
    }
    .m-badge.outline {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .m-card-summary {
      margin-top: 8px;
      font-family: var(--font-sans-cn);
      font-size: 14.5px;
      line-height: 1.66;
      color: var(--ink-body);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* ========== 4. 首屏底部满宽巨型墨黑反白报头带 ========== */
    .masthead-wrap {
      padding: 0 32px;
    }
    .masthead-black-band {
      width: 100%;
      background: var(--ink);
      padding: 12px 16px 6px;
      display: block;
    }
    .masthead-svg { width: 100%; height: auto; display: block; }

    /* ========== 5. 下半区分类索引 + 报刊三栏全量网格 ========== */
    .feed-section { padding: 18px 32px 44px; }
    .index-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      padding: 12px 0; border-top: 1px solid var(--ink); border-bottom: 1.5px solid var(--ink); flex-wrap: wrap;
    }
    .cat-list { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .cat-btn {
      background: transparent; border: 1px solid transparent; color: var(--ink);
      font-family: var(--font-sans-cn); font-size: 14px; font-weight: 500;
      padding: 5px 12px; cursor: pointer; display: inline-flex; align-items: flex-start; gap: 4px;
    }
    .cat-btn:hover { border-color: var(--rule); }
    .cat-btn.active { background: var(--ink); color: var(--paper-bg); }
    .cat-num { font-family: var(--font-mono); font-size: 10px; opacity: 0.72; }
    .index-meta { font-family: var(--font-mono); font-size: 12px; color: var(--ink-muted); }

    .broadsheet-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
      border-bottom: 1.5px solid var(--ink);
    }
    .grid-cell { padding: 28px 26px; border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
    .grid-cell:nth-child(3n) { border-right: none; padding-right: 0; }
    .grid-cell:nth-child(3n + 1) { padding-left: 0; }
    .empty-msg { grid-column: 1 / -1; padding: 54px 20px; text-align: center; font-size: 16px; color: var(--ink-muted); }

    .colophon {
      padding: 22px 0 8px; display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 12px; font-family: var(--font-sans-cn); font-size: 12.5px; color: var(--ink-muted);
    }
    .colophon strong { font-family: var(--font-display); font-size: 16px; color: var(--ink); }

    /* ========== 6. 详情剪报弹窗 ========== */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(29, 29, 27, 0.76); z-index: 300;
      display: none; align-items: center; justify-content: center; padding: 22px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-sheet {
      background: var(--paper-modal); color: var(--ink); width: 100%; max-width: 740px; max-height: 90vh;
      overflow-y: auto; border: 2px solid var(--ink); padding: 26px 32px 30px;
    }
    .modal-top {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 12px; border-bottom: 1px solid var(--rule); margin-bottom: 18px;
      font-family: var(--font-sans-cn); font-size: 12.5px; color: var(--ink-muted);
    }
    .modal-close {
      background: transparent; border: 1px solid var(--ink); color: var(--ink);
      padding: 4px 12px; font-family: var(--font-mono); font-size: 12px; cursor: pointer;
    }
    .modal-close:hover { background: var(--ink); color: var(--paper-modal); }
    .modal-art { width: 100%; aspect-ratio: 16 / 6.2; border: 1px solid var(--ink); overflow: hidden; margin-bottom: 18px; }
    .modal-art svg { width: 100%; height: 100%; display: block; }
    .modal-title { font-family: var(--font-serif-cn); font-weight: 900; font-size: 26px; line-height: 1.3; margin-bottom: 14px; }
    .modal-summary { font-family: var(--font-sans-cn); font-size: 15.5px; line-height: 1.82; color: var(--ink-body); margin-bottom: 22px; }

    .impact-box {
      border: 1px dashed var(--ink); border-left: 4px solid var(--ink); background: var(--paper-bg);
      padding: 16px 18px; margin-bottom: 22px;
    }
    .impact-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .impact-head h4 { font-family: var(--font-serif-cn); font-size: 16px; font-weight: 700; }
    .draft-pill { border: 1px dashed var(--ink); font-family: var(--font-sans-cn); font-size: 11px; padding: 1px 6px; color: var(--ink-muted); }
    .impact-list { list-style: none; display: flex; flex-direction: column; gap: 8px; font-family: var(--font-sans-cn); font-size: 14.5px; line-height: 1.7; color: var(--ink-body); }
    .impact-list li { padding-left: 14px; position: relative; }
    .impact-list li::before { content: "▪"; position: absolute; left: 0; color: var(--accent); }

    .modal-actions { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
    .btn-ink {
      flex: 1; min-width: 220px; background: var(--ink); color: var(--paper-modal);
      border: 1px solid var(--ink); padding: 12px 18px; text-align: center; text-decoration: none;
      font-family: var(--font-sans-cn); font-size: 14px; cursor: pointer;
    }
    .btn-ink:hover { background: var(--accent); border-color: var(--accent); }
    .btn-outline {
      background: transparent; color: var(--ink); border: 1px solid var(--ink);
      padding: 12px 16px; font-family: var(--font-sans-cn); font-size: 13.5px; cursor: pointer;
    }
    .btn-outline:hover { background: var(--paper-bg); }
    .modal-note { font-family: var(--font-sans-cn); font-size: 12px; color: var(--ink-muted); border-top: 1px solid var(--rule-light); padding-top: 10px; }

    /* ========== 7. 移动端单列适配 ========== */
    body.mobile-preview .top-bar { padding: 0 16px; height: 60px; }
    body.mobile-preview .top-left { font-size: 11.5px; }
    body.mobile-preview .top-center { font-size: 16px; }
    body.mobile-preview .hero-section { padding: 18px 0 16px; }
    body.mobile-preview .rail-item { flex: 0 0 84%; min-width: 84%; padding: 0 16px; }
    body.mobile-preview .digest-kicker { font-size: 28px; }
    body.mobile-preview .digest-text { font-size: 14.5px; }
    body.mobile-preview .masthead-wrap { padding: 0 16px; }
    body.mobile-preview .feed-section { padding: 12px 16px 32px; }
    body.mobile-preview .cat-list { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 4px; }
    body.mobile-preview .cat-btn { white-space: nowrap; font-size: 13.5px; }
    body.mobile-preview .broadsheet-grid { grid-template-columns: 1fr; }
    body.mobile-preview .grid-cell { padding: 22px 0; border-right: none; }
    body.mobile-preview .modal-sheet { padding: 20px 18px; }
    body.mobile-preview .modal-title { font-size: 21px; }

    @media (max-width: 960px) {
      .rail-item { flex: 0 0 82%; min-width: 82%; padding: 0 18px; }
      .masthead-wrap, .feed-section { padding-left: 16px; padding-right: 16px; }
      .broadsheet-grid { grid-template-columns: 1fr; }
      .grid-cell { padding: 22px 0 !important; border-right: none !important; }
      .viewport-mini { display: none; }
    }
  </style>
</head>
<body>
  <div class="stage-wrapper">
    <div class="paper-page">
      <!-- 1. 顶部 1px 报眉 -->
      <header class="top-bar">
        <div class="top-left" id="topDateText">Beijing · 2026-11-22</div>
        <div class="top-center">The Legal AI Daily</div>
        <div class="top-right">
          <div class="viewport-mini" aria-label="视口切换">
            <button class="vp-btn active" id="vpDesktop" onclick="setViewport('desktop')">桌面</button>
            <button class="vp-btn" id="vpMobile" onclick="setViewport('mobile')">移动</button>
          </div>
          <button class="menu-btn" id="menuBtn" onclick="toggleDrawer()" aria-label="展开日期与检索菜单">
            <span></span><span></span>
          </button>
        </div>
      </header>

      <!-- 折叠抽屉（日期切换 + 关键词检索） -->
      <div class="drawer" id="drawer">
        <div class="drawer-group">
          <span>期号日期：</span>
          <div id="drawerDates"></div>
        </div>
        <div class="drawer-group">
          <input class="drawer-search" id="searchInput" type="text" placeholder="检索关键词 / 法条 / 模型..." />
        </div>
      </div>

      <!-- 2. 首屏缓缓流动横轨（包含卡片与今日综述） + 满宽墨黑反白报头 -->
      <section class="hero-section">
        <div class="hero-rail-viewport" id="heroViewport" aria-label="首屏流动情报与今日综述">
          <div class="hero-rail-track" id="heroTrack"></div>
        </div>

        <div class="masthead-wrap">
          <div class="masthead-black-band" aria-label="LEXAI DAILY 报头">
            <svg class="masthead-svg" viewBox="0 0 1200 225" preserveAspectRatio="xMidYMid meet">
              <text x="600" y="196" text-anchor="middle" fill="#C8C0B6"
                font-family="'Bodoni Moda', Georgia, 'Times New Roman', serif"
                font-weight="900" font-size="214" letter-spacing="-7"
                textLength="1168" lengthAdjust="spacingAndGlyphs">LEXAI DAILY</text>
            </svg>
          </div>
        </div>
      </section>

      <!-- 3. 分类索引条 + 全量带插画情报分栏 -->
      <section class="feed-section">
        <nav class="index-bar" aria-label="分类筛选">
          <div class="cat-list" id="catList"></div>
          <div class="index-meta" id="indexMeta">VOL.04 NO.326 · 7 DISPATCHES</div>
        </nav>

        <div class="broadsheet-grid" id="broadsheetGrid"></div>

        <footer class="colophon">
          <div><strong>LEXAI DAILY© 2026</strong> · 法律人的 AI 情报雷达 · 严格区分事实与观点</div>
          <div>点击任意卡片查看「实务影响研判」与「一手信源」</div>
        </footer>
      </section>
    </div>
  </div>

  <!-- 4. 详情剪报弹窗 -->
  <div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true">
    <div class="modal-sheet">
      <div class="modal-top">
        <div id="modalMeta"></div>
        <button class="modal-close" onclick="closeModal()">ESC / 关闭</button>
      </div>
      <div class="modal-art" id="modalArt"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <p class="modal-summary" id="modalSummary"></p>

      <div class="impact-box">
        <div class="impact-head">
          <h4>实务影响锚点（执业律师与企业法务视角）</h4>
          <span class="draft-pill">AI 初稿</span>
        </div>
        <ul class="impact-list" id="modalImpactList"></ul>
      </div>

      <div class="modal-actions">
        <a class="btn-ink" id="modalSourceBtn" href="#" target="_blank" rel="noopener noreferrer">直达一手信源 ↗</a>
        <button class="btn-outline" id="modalCopyBtn" onclick="copyCitation()">复制法律人引用格式</button>
      </div>
      <p class="modal-note">合规提示：原型示例链接使用保留占位域名；标有“AI 初稿”之实务影响仅供初步研判，不构成正式法律意见。</p>
    </div>
  </div>

  <script>
    const CATEGORIES = ["全部", "监管与合规", "模型与技术", "实务与工具", "判例与学术", "行业与资本"];

    function getIllustration(key) {
      const arts = {
        watermark: `<svg viewBox="0 0 480 210" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#102530"/><stop offset="100%" stop-color="#071218"/></linearGradient>
            <radialGradient id="g1a" cx="52%" cy="48%" r="42%"><stop offset="0%" stop-color="#F6B84C"/><stop offset="55%" stop-color="#B95D1C" stop-opacity="0.7"/><stop offset="100%" stop-color="#102530" stop-opacity="0"/></radialGradient>
          </defs>
          <rect width="480" height="210" fill="url(#g1)"/><rect width="480" height="210" fill="url(#g1a)"/>
          <path d="M0 168 L480 168 L480 210 L0 210 Z" fill="#6D1F10"/>
          <g stroke="#F8D27D" stroke-width="1.2" fill="none" opacity="0.82">
            <rect x="172" y="28" width="136" height="140" rx="68" fill="#D98B2B" fill-opacity="0.22"/>
            <circle cx="240" cy="98" r="46"/><circle cx="240" cy="98" r="30"/><circle cx="240" cy="98" r="14"/>
            <line x1="120" y1="98" x2="360" y2="98" stroke-dasharray="4 4"/>

    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
      document.body.style.overflow = "";
    }

    function copyCitation() {
      if (!currentModalItem) return;
      const cite = `【LexAIDaily ${currentModalItem.date}｜${currentModalItem.category}】${currentModalItem.title}（${currentModalItem.factLevel}；一手信源：https://${currentModalItem.sourceDomain}）`;
      navigator.clipboard?.writeText(cite).catch(() => {});
      const btn = document.getElementById("modalCopyBtn");
      btn.textContent = "已复制引用格式 ✓";
      setTimeout(() => { btn.textContent = "复制法律人引用格式"; }, 1800);
    }

    document.getElementById("searchInput").addEventListener("input", e => { currentSearch = e.target.value; render(); });
    document.getElementById("modalBackdrop").addEventListener("click", e => { if (e.target.id === "modalBackdrop") closeModal(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

    render();
    requestAnimationFrame(tickRail);
  </script>
</body>
</html>
